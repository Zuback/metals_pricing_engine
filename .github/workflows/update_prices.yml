name: Run Pricing Engine

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch: # Allows you to trigger it manually from GitHub anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Dependencies
        run: dart pub get

      - name: Run Pricing Engine
        run: dart run bin/metals_pricing_engine.dart

      - name: Commit and Push Updated prices.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          
          if git diff --staged --quiet; then
            echo "No changes to prices.json to commit."
          else
            git commit -m "Auto-update prices.json [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi