name: Run Pricing Engine

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: pricing-engine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Dependencies
        run: dart pub get

      - name: Run Pricing Engine
        env:
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
        run: dart run bin/metals_pricing_engine.dart

      - name: Commit and Push Updated prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prices.json

          if git diff --staged --quiet; then
            echo "No changes to prices.json to commit."
            exit 0
          fi

          git commit -m "Auto-update prices.json [skip ci]"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main