name: Run Pricing Engine

on:
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours
  workflow_dispatch: # Allows you to trigger it manually from GitHub anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Dependencies
        run: dart pub get

      - name: Run Pricing Engine
        run: dart run bin/metals_pricing_engine.dart

      - name: Pull latest changes to avoid divergence
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Commit and Push Updated prices.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update prices.json [skip ci]"
          file_pattern: "prices.json"